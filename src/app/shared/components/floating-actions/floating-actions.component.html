<div class="fixed bottom-6 right-6 z-40 flex flex-col items-center gap-3">
  
  <!-- Botón Volver Arriba -->
  @if (showScrollTop()) {
    <button
      type="button"
      (click)="scrollToTop()"
      class="group flex h-11 w-11 items-center justify-center rounded-full border border-zinc-700 bg-zinc-900/90 text-zinc-300 shadow-lg shadow-black/40 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-cyan-500 hover:bg-zinc-800 hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 dark:border-zinc-700 dark:bg-zinc-900/90 light:border-slate-300 light:bg-white light:text-slate-700 light:hover:text-cyan-600"
      [title]="scrollTopText()"
      [attr.aria-label]="scrollTopText()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    </button>
  }

  <!-- Botón Flotante de WhatsApp con Efecto Glow -->
  <a
    [href]="whatsappUrl()"
    target="_blank"
    rel="noopener noreferrer"
    class="group relative flex h-14 w-14 items-center justify-center rounded-full bg-emerald-500 text-white shadow-xl shadow-emerald-500/30 transition-all duration-300 hover:scale-110 hover:bg-emerald-400 hover:shadow-emerald-500/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950"
    [title]="tooltipText()"
    [attr.aria-label]="tooltipText()"
  >
    <!-- Efecto de onda pulsante (respetando prefers-reduced-motion) -->
    <span class="absolute inline-flex h-full w-full animate-ping motion-reduce:animate-none rounded-full bg-emerald-400 opacity-30"></span>

    <!-- Icono de WhatsApp -->
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="relative z-10" aria-hidden="true">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
  </a>

</div>
