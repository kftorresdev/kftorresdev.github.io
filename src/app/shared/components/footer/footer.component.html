<footer class="border-t border-zinc-800 bg-zinc-950 py-12 text-zinc-400 transition-colors duration-300 dark:border-zinc-800 dark:bg-zinc-950 light:border-slate-200 light:bg-slate-50 light:text-slate-600">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col items-center justify-between gap-6 md:flex-row">
      
      <!-- Identidad y Copyright -->
      <div class="flex flex-col items-center gap-2 md:items-start">
        <a href="#" class="font-mono text-base font-bold text-zinc-100 dark:text-zinc-100 light:text-slate-900">
          &lt;/&gt; kftorres<span class="text-cyan-400">.dev</span>
        </a>
        <p class="text-xs text-zinc-500 dark:text-zinc-500 light:text-slate-500 text-center md:text-left">
          &copy; {{ currentYear }} {{ dataService.profile.fullName }}. {{ t().allRightsReserved }}
        </p>
        <p class="text-[11px] text-zinc-600 dark:text-zinc-600 light:text-slate-400 max-w-md text-center md:text-left">
          {{ t().builtWith }}
        </p>
      </div>

      <!-- Zona Horaria y Redes -->
      <div class="flex flex-col items-center gap-3 md:items-end">
        <div class="flex items-center gap-2 rounded-full border border-zinc-800 bg-zinc-900/60 px-3 py-1 font-mono text-xs text-zinc-400 dark:border-zinc-800 dark:bg-zinc-900/60 light:border-slate-200 light:bg-white light:text-slate-600">
          <span class="relative flex h-2 w-2">
            <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
          </span>
          <span>{{ dataService.profile.location[langService.currentLanguage()] }} (UTC-6)</span>
        </div>

        <div class="flex items-center gap-4 text-sm">
          <a
            [href]="dataService.profile.githubUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="text-zinc-400 transition-colors hover:text-cyan-400 dark:text-zinc-400 light:text-slate-600 light:hover:text-cyan-600"
            title="GitHub"
          >
            GitHub
          </a>
          <span class="text-zinc-700 dark:text-zinc-700 light:text-slate-300">&middot;</span>
          <a
            [href]="dataService.profile.linkedinUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="text-zinc-400 transition-colors hover:text-cyan-400 dark:text-zinc-400 light:text-slate-600 light:hover:text-cyan-600"
            title="LinkedIn"
          >
            LinkedIn
          </a>
          <span class="text-zinc-700 dark:text-zinc-700 light:text-slate-300">&middot;</span>
          <a
            [href]="dataService.profile.whatsappUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="text-zinc-400 transition-colors hover:text-emerald-400 dark:text-zinc-400 light:text-slate-600 light:hover:text-emerald-600"
            title="WhatsApp"
          >
            WhatsApp
          </a>
          <span class="text-zinc-700 dark:text-zinc-700 light:text-slate-300">&middot;</span>
          <a
            [href]="'mailto:' + dataService.profile.email"
            class="text-zinc-400 transition-colors hover:text-cyan-400 dark:text-zinc-400 light:text-slate-600 light:hover:text-cyan-600"
            title="Email"
          >
            Email
          </a>
        </div>
      </div>

    </div>
  </div>
</footer>
