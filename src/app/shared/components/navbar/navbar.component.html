<header class="sticky top-0 z-50 w-full border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-md transition-colors duration-300 dark:border-zinc-800/80 dark:bg-zinc-950/80 light:border-slate-200 light:bg-white/80">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6 lg:px-8">
    
    <!-- Identidad / Logotipo de Marca -->
    <a
      href="#"
      [attr.aria-label]="t().homeLink"
      class="group flex items-center gap-2 rounded-lg font-mono text-base font-bold tracking-tight text-zinc-100 transition-colors hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 dark:text-zinc-100 light:text-slate-900"
    >
      <span class="flex h-8 w-8 items-center justify-center rounded-lg border border-cyan-500/30 bg-cyan-950/40 text-cyan-400 shadow-sm shadow-cyan-500/20 group-hover:border-cyan-400 group-hover:bg-cyan-900/50">
        &lt;/&gt;
      </span>
      <span>kftorres<span class="text-cyan-400">.dev</span></span>
    </a>

    <!-- Enlaces de Navegación de Escritorio -->
    <nav class="hidden md:flex md:items-center md:gap-6" aria-label="Navegación principal">
      <a
        href="#proyectos"
        class="rounded-md px-2 py-1 text-sm font-medium text-zinc-400 transition-colors hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 dark:text-zinc-400 light:text-slate-600 light:hover:text-cyan-600"
      >
        {{ t().projects }}
      </a>
      <a
        href="#habilidades"
        class="rounded-md px-2 py-1 text-sm font-medium text-zinc-400 transition-colors hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 dark:text-zinc-400 light:text-slate-600 light:hover:text-cyan-600"
      >
        {{ t().skills }}
      </a>
      <a
        href="#experiencia"
        class="rounded-md px-2 py-1 text-sm font-medium text-zinc-400 transition-colors hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 dark:text-zinc-400 light:text-slate-600 light:hover:text-cyan-600"
      >
        {{ t().experience }}
      </a>
      <a
        href="#contacto"
        class="rounded-md px-2 py-1 text-sm font-medium text-zinc-400 transition-colors hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 dark:text-zinc-400 light:text-slate-600 light:hover:text-cyan-600"
      >
        {{ t().contact }}
      </a>
    </nav>

    <!-- Controles de Acción (Idioma, Tema, Descarga CV) -->
    <div class="hidden items-center gap-3 sm:flex">
      
      <!-- Selector Bilingüe ES / EN con Signals -->
      <button
        type="button"
        (click)="onToggleLanguage()"
        class="flex min-h-[44px] min-w-[44px] items-center justify-center gap-1 rounded-lg border border-zinc-800 bg-zinc-900/80 px-3 py-2 font-mono text-xs font-semibold text-zinc-300 transition-all hover:border-cyan-500/50 hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 dark:border-zinc-800 dark:bg-zinc-900/80 light:border-slate-200 light:bg-slate-100 light:text-slate-700"
        [title]="t().toggleLanguage"
        [attr.aria-label]="t().toggleLanguage"
      >
        <span [class.text-cyan-400]="!langService.isEnglish()" [class.font-bold]="!langService.isEnglish()">ES</span>
        <span class="text-zinc-600 dark:text-zinc-600 light:text-slate-400">/</span>
        <span [class.text-cyan-400]="langService.isEnglish()" [class.font-bold]="langService.isEnglish()">EN</span>
      </button>

      <!-- Selector de Modo Oscuro / Claro -->
      <button
        type="button"
        (click)="onToggleTheme()"
        class="flex min-h-[44px] min-w-[44px] items-center justify-center rounded-lg border border-zinc-800 bg-zinc-900/80 text-zinc-400 transition-all hover:border-zinc-700 hover:text-zinc-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 dark:border-zinc-800 dark:bg-zinc-900/80 dark:text-zinc-400 dark:hover:text-zinc-100 light:border-slate-200 light:bg-slate-100 light:text-slate-600 light:hover:text-slate-900"
        [title]="t().toggleTheme"
        [attr.aria-label]="t().toggleTheme"
      >
        @if (themeService.isDark()) {
          <!-- Icono Sol (Modo Claro) -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        } @else {
          <!-- Icono Luna (Modo Oscuro) -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        }
      </button>

      <!-- Botón de Descarga Directa de CV en PDF -->
      <a
        [href]="activeCvUrl()"
        target="_blank"
        rel="noopener noreferrer"
        download
        class="inline-flex min-h-[44px] items-center gap-1.5 rounded-lg border border-cyan-500/40 bg-gradient-to-r from-cyan-500/10 to-indigo-500/10 px-4 py-2 text-xs font-semibold text-cyan-300 shadow-sm transition-all hover:border-cyan-400 hover:from-cyan-500/20 hover:to-indigo-500/20 hover:text-cyan-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>{{ t().downloadCv }}</span>
      </a>

    </div>

    <!-- Botón Menú Hamburguesa para Móviles -->
    <div class="flex items-center gap-2 sm:hidden">
      <!-- Selector de Idioma en móvil con target mínimo de 44x44px -->
      <button
        type="button"
        (click)="onToggleLanguage()"
        class="flex min-h-[44px] min-w-[44px] items-center justify-center rounded-lg border border-zinc-800 bg-zinc-900/80 px-2.5 py-1.5 font-mono text-xs font-bold text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950"
        [attr.aria-label]="t().toggleLanguage"
        [title]="t().toggleLanguage"
      >
        {{ langService.isEnglish() ? 'EN' : 'ES' }}
      </button>

      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="inline-flex min-h-[44px] min-w-[44px] items-center justify-center rounded-lg border border-zinc-800 bg-zinc-900 text-zinc-300 transition-colors hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="mobile-nav-menu"
        [attr.aria-label]="isMobileMenuOpen() ? t().closeMenu : t().mobileMenu"
      >
        @if (isMobileMenuOpen()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/>
          </svg>
        }
      </button>
    </div>

  </div>

  <!-- Desplegable del Menú Móvil -->
  @if (isMobileMenuOpen()) {
    <div
      id="mobile-nav-menu"
      class="border-b border-zinc-800 bg-zinc-950/95 px-4 pt-2 pb-5 backdrop-blur-xl sm:hidden dark:border-zinc-800 dark:bg-zinc-950/95 light:border-slate-200 light:bg-white/95"
    >
      <div class="flex flex-col space-y-1 pt-2">
        <a
          href="#proyectos"
          (click)="closeMobileMenu()"
          class="flex min-h-[44px] items-center rounded-lg px-3 py-3 text-base font-medium text-zinc-300 transition-colors hover:bg-zinc-900 hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
        >
          {{ t().projects }}
        </a>
        <a
          href="#habilidades"
          (click)="closeMobileMenu()"
          class="flex min-h-[44px] items-center rounded-lg px-3 py-3 text-base font-medium text-zinc-300 transition-colors hover:bg-zinc-900 hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
        >
          {{ t().skills }}
        </a>
        <a
          href="#experiencia"
          (click)="closeMobileMenu()"
          class="flex min-h-[44px] items-center rounded-lg px-3 py-3 text-base font-medium text-zinc-300 transition-colors hover:bg-zinc-900 hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
        >
          {{ t().experience }}
        </a>
        <a
          href="#contacto"
          (click)="closeMobileMenu()"
          class="flex min-h-[44px] items-center rounded-lg px-3 py-3 text-base font-medium text-zinc-300 transition-colors hover:bg-zinc-900 hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
        >
          {{ t().contact }}
        </a>

        <div class="pt-3 border-t border-zinc-800 flex items-center justify-between gap-3">
          <button
            type="button"
            (click)="onToggleTheme()"
            class="flex min-h-[44px] items-center gap-2 rounded-lg border border-zinc-800 bg-zinc-900 px-3.5 py-2.5 text-xs font-medium text-zinc-300 transition-colors hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
            [attr.aria-label]="t().toggleTheme"
          >
            <span>{{ themeService.isDark() ? ('☀️ ' + t().themeLight) : ('🌙 ' + t().themeDark) }}</span>
          </button>

          <a
            [href]="activeCvUrl()"
            target="_blank"
            rel="noopener noreferrer"
            download
            class="flex min-h-[44px] items-center gap-1.5 rounded-lg border border-cyan-500/50 bg-cyan-950/40 px-3.5 py-2.5 text-xs font-semibold text-cyan-300 transition-colors hover:bg-cyan-900/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>{{ t().downloadCv }}</span>
          </a>
        </div>
      </div>
    </div>
  }
</header>
